# Keep the hosted checkout warm through judging (spec §8: an external 10-minute ping on the checkout only;
# the merchant wakes on demand so the two services stay inside Render's 750 free instance hours).
# The step never fails, so a slow cold start does not turn into failure e-mails.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health on the checkout
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://sharepay-checkout.onrender.com/api/health || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "checkout did not answer 200 after 3 attempts"
          exit 0
